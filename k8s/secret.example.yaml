# Exemplo de Secret do -os — NUNCA versionar o Secret real.
# Criar com (padrão F3):
#   kubectl create secret generic os-service-secret -n oficina \
#     --from-literal=DJANGO_SECRET_KEY=<chave> \
#     --from-literal=POSTGRES_DB=os_service_db \
#     --from-literal=POSTGRES_USER=os_user \
#     --from-literal=POSTGRES_PASSWORD='<senha>'
# Obs.: OBSERVABILIDADE_SALT (hash de CPF nos logs) segue o mesmo padrão,
# valor aleatório exclusivo por ambiente.
apiVersion: v1
kind: Secret
metadata:
  name: os-service-secret
  namespace: oficina
  labels:
    app: os-service
    fase: "4"
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "sua-chave-aqui"
  POSTGRES_DB: "os_service_db"
  POSTGRES_USER: "os_user"
  POSTGRES_PASSWORD: "sua-senha"
