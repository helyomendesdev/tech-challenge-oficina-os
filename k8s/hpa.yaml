apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: os-service-hpa
  namespace: oficina
  labels:
    app: os-service
    fase: "4"

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: os-service

  minReplicas: 2
  maxReplicas: 6

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
