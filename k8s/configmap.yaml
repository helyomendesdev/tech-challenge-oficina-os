apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  namespace: oficina
  labels:
    app: os-service
    fase: "4"

data:
  DJANGO_DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "app.settings"
  DJANGO_ALLOWED_HOSTS: "*"   # substituir por hosts/domínios reais no deploy

  DB_HOST: "<RDS_ENDPOINT_DO_OS>"
  DB_PORT: "5432"

  # URLs dos serviços pares (compensações/comandos da saga)
  BILLING_SERVICE_URL: "http://billing-service:8000"
  EXECUTION_SERVICE_URL: "http://execution-service:8000"

  # Fila da saga (contrato v1). SQS FIFO: SAGA_QUEUE_URL = comandos
  # (orquestrador -> serviços); SAGA_RESPONSE_QUEUE_URL = respostas
  # (serviços -> orquestrador, consumidas pelo worker-consumer).
  SAGA_QUEUE_URL: "<URL_FILA_COMANDOS>"          # ex.: https://sqs.sa-east-1.amazonaws.com/<acct>/saga-comandos.fifo
  SAGA_RESPONSE_QUEUE_URL: "<URL_FILA_RESPOSTAS>"
  SAGA_POLL_INTERVAL_SECONDS: "10"

  # Prazo do timeout de aprovação (ADR-003; fora do contrato)
  ORCAMENTO_TIMEOUT_MINUTOS: "30"

  # Identificação nos eventos/logs (padrão F3)
  SERVICE_NAME: "os-service"
  SERVICE_ENVIRONMENT: "homologacao"   # homologacao | producao
  SERVICE_VERSION: "1.0.0"
