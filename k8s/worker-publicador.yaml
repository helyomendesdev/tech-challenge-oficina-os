apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service-publicador-comandos
  namespace: oficina
  labels:
    app: os-service-publicador
    env: homologacao
    fase: "4"
    papel: "outbox-saga"

spec:
  # Drain da outbox da saga (ADR-001): o -os grava o comando em saga_comando na
  # mesma transacao da transicao, e so este processo publica nas filas de comandos
  # do Billing e do Execution. Sem ele nenhum comando da Saga sai do -os.
  replicas: 1   # FIFO com MessageGroupId = sagaId: sagas distintas sao
                # independentes, mas 1 replica simplifica o 1o deploy;
                # escalar via volume de fila fica para depois se precisar.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: os-service-publicador

  template:
    metadata:
      labels:
        app: os-service-publicador
        fase: "4"

    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      automountServiceAccountToken: false   # worker sem acesso à API do cluster

      containers:
        - name: publicador
          image: <ECR_REPO>:<IMAGE_TAG>
          imagePullPolicy: IfNotPresent

          command:
            - python
            - manage.py
            - publicar_comandos_saga
            - --loop
            - --intervalo
            - "1"

          envFrom:
            - configMapRef:
                name: os-service-config
            - secretRef:
                name: os-service-secret

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"

          # Sem HTTP probe: worker sem porta. Liveness por script de fila:
          # se o laco travar, o container deve cair (fail-fast do command).
