name: CI

on:
  push:
    branches: [main, develop, feature/*, fix/*, feat/*]
  pull_request:
    branches: [main, develop]

env:
  DJANGO_SECRET_KEY: "test-key-not-for-production"
  DJANGO_SETTINGS_MODULE: "app.settings_test"
  POSTGRES_PASSWORD: "test_pass"
  # No env do workflow (e nao do passo) para o `if:` do scan enxergar.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: os_service_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Django system check
      run: python manage.py check --settings=app.settings_test

    - name: Run tests with coverage (80% mínimo por serviço)
      run: |
        python -m pytest os_service/ -v --tb=short \
          --cov=os_service --cov-report=xml --cov-report=term \
          --cov-fail-under=80 --junitxml=report.xml

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: report.xml

    # Qualidade: o scanner envia o coverage.xml ao SonarCloud. A trava de
    # cobertura >=80% e o --cov-fail-under do pytest acima; o QG do Sonar way
    # fica como vitrine no dashboard (o org no plano free nao pode atribuir
    # gate proprio, e o new_coverage sem valor em push de yaml-only reprovava
    # o wait). Sem SONAR_TOKEN (ex.: PR vindo de fork) o passo e pulado.
    - name: SonarCloud scan
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
      env:
        SONAR_HOST_URL: https://sonarcloud.io

    - name: Build Docker image
      run: docker build -t os-service:${{ github.sha }} .
