name: CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC
  contents: read

jobs:
  # Decide se os jobs que falam com a AWS podem rodar. `secrets` nao existe no
  # `if` de job/step: quando o workflow usava `if: ${{ secrets... }}`, o GitHub
  # rejeitava o arquivo inteiro e as execucoes morriam com 0 jobs. A checagem
  # vira output deste job; sem credenciais o CD fica verde com os jobs de AWS
  # pulados, em vez de vermelho.
  preflight:
    name: Preflight (credenciais AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_aws: ${{ steps.check.outputs.has_aws }}
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Verifica credenciais AWS
        id: check
        run: |
          if [ -n "$AWS_ROLE_ARN" ] || [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
            echo "Credenciais AWS presentes."
          else
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sem credenciais AWS::Os jobs que falam com a AWS serao pulados. Recadastre os secrets e rode o CD por workflow_dispatch."
          fi

  build-and-push:
    needs: [preflight]
    if: needs.preflight.outputs.has_aws == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    env:
      # `secrets` nao pode ser usado em `if` de step; expor via env
      HAS_ROLE: ${{ secrets.AWS_ROLE_ARN }}
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      if: ${{ env.HAS_ROLE != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Configure AWS credentials (static)
      if: ${{ env.HAS_ROLE == '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to ECR
      id: meta
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "version=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-aws:
    needs: [build-and-push, preflight]
    if: needs.preflight.outputs.has_aws == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `secrets` nao pode ser usado em `if` de step; expor via env
      HAS_ROLE: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      if: ${{ env.HAS_ROLE != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Configure AWS credentials (static)
      if: ${{ env.HAS_ROLE == '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl && sudo mv kubectl /usr/local/bin/

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

    - name: Set image on deployment and apply manifests
      run: |
        kubectl set image deployment/os-service os-service=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -n oficina-os || true
        kubectl apply -f k8s/ -n oficina-os

    - name: Wait for rollout
      run: kubectl rollout status deployment/os-service -n oficina-os --timeout=300s
